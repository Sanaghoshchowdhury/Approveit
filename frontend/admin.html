<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ApproveIt | Admin Dashboard</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script>
    // Configure Tailwind to use 'class' for dark mode
    tailwind.config = {
      darkMode: 'class',
    }

    // Immediate Theme Check (Prevents white flash)
    if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>
</head>

<body class="bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100 min-h-screen transition-colors duration-500">

  <nav class="flex justify-between items-center p-4 bg-white dark:bg-slate-800 shadow-sm border-b dark:border-slate-700">
    <div class="flex items-center gap-3">
      <div class="bg-indigo-600 p-2 rounded-lg text-white font-bold">A</div>
      <h1 class="text-xl font-bold tracking-tight">ApproveIt Admin</h1>
    </div>
    
    <div class="flex gap-5 items-center">
      <div class="relative cursor-pointer">
        <span class="text-xl">🔔</span>
        <span class="absolute -top-1 -right-1 bg-red-500 w-2.5 h-2.5 rounded-full border-2 border-white dark:border-slate-800"></span>
      </div>
      
      <button id="themeBtn" onclick="toggleDark()" class="w-10 h-10 flex items-center justify-center rounded-xl bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 transition-all active:scale-90">
        🌙
      </button>
    </div>
  </nav>

  <main class="p-8 max-w-6xl mx-auto">
    
    <header class="mb-10">
      <h2 class="text-3xl font-bold">Admin Panel</h2>
      <p class="text-slate-500 dark:text-slate-400 font-medium">System-wide verification and financial oversight.</p>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">

      <div class="bg-white dark:bg-slate-800 p-8 rounded-3xl shadow-sm border border-slate-100 dark:border-slate-700 transition-all hover:shadow-xl">
        <div class="flex justify-between items-start mb-6">
          <h3 class="font-bold text-xl">Doc Verification</h3>
          <span class="bg-blue-100 dark:bg-blue-900/30 text-blue-700 dark:text-blue-400 text-[10px] font-bold px-2 py-1 rounded uppercase">Audit</span>
        </div>

        <div class="w-full bg-slate-200 dark:bg-slate-700 rounded-full h-2.5 mb-6">
          <div class="bg-blue-600 h-2.5 rounded-full w-[70%] transition-all duration-1000"></div>
        </div>

        <div class="aspect-video w-full bg-slate-50 dark:bg-slate-700/50 rounded-2xl mb-6 flex flex-col items-center justify-center border-2 border-dashed border-slate-200 dark:border-slate-600 group hover:border-indigo-400 transition-colors cursor-pointer">
          <span class="text-3xl mb-2 opacity-50 group-hover:scale-110 transition">📄</span>
          <p class="text-xs text-slate-400 font-bold uppercase tracking-widest">Verify ID_Proof.pdf</p>
        </div>

        <button onclick="showToast('Verification successful!', 'success')" class="w-full bg-indigo-600 hover:bg-indigo-700 py-4 rounded-2xl text-white font-bold transition-all shadow-lg shadow-indigo-100 dark:shadow-none active:scale-95">
          Verify Document
        </button>
      </div>

      <div class="bg-white dark:bg-slate-800 p-8 rounded-3xl shadow-sm border border-slate-100 dark:border-slate-700 transition-all hover:shadow-xl">
        <div class="flex justify-between items-start mb-6">
          <h3 class="font-bold text-xl">Payment Gate</h3>
          <span class="bg-green-100 dark:bg-green-900/30 text-green-700 dark:text-green-400 text-[10px] font-bold px-2 py-1 rounded uppercase">Finance</span>
        </div>

        <div class="w-full bg-slate-200 dark:bg-slate-700 rounded-full h-2.5 mb-6">
          <div class="bg-green-600 h-2.5 rounded-full w-[85%] transition-all duration-1000"></div>
        </div>

        <div class="bg-slate-50 dark:bg-slate-700/30 p-5 rounded-2xl mb-6 space-y-3 border border-slate-100 dark:border-slate-600">
          <div class="flex justify-between text-sm">
              <span class="text-slate-400">Transaction:</span>
              <span class="font-mono font-bold">#TXN-98432-APP</span>
          </div>
          <div class="flex justify-between text-sm">
              <span class="text-slate-400">Amount:</span>
              <span class="font-bold text-green-600">$450.00 USD</span>
          </div>
        </div>

        <button onclick="showToast('Payment Approved!', 'success')" class="w-full bg-green-600 hover:bg-green-700 py-4 rounded-2xl text-white font-bold transition-all shadow-lg shadow-green-100 dark:shadow-none active:scale-95">
          Release Funds
        </button>
      </div>

    </div>
  </main>

  <div id="toast" class="fixed bottom-10 right-10 flex items-center gap-3 bg-slate-900 dark:bg-white text-white dark:text-slate-900 px-6 py-4 rounded-2xl shadow-2xl transition-all duration-300 translate-y-20 opacity-0 pointer-events-none">
    <span id="toastIcon">✅</span>
    <span id="toastMsg" class="font-bold"></span>
  </div>

  <script>
    // 1. Theme Toggling Logic
    function toggleDark() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      updateButtonIcon(isDark);
    }

    function updateButtonIcon(isDark) {
      const btn = document.getElementById('themeBtn');
      if (btn) btn.innerText = isDark ? '☀️' : '🌙';
    }

    // 2. Toast Logic
    function showToast(message, type) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      
      toastMsg.innerText = message;
      
      // Animate In
      toast.classList.remove('translate-y-20', 'opacity-0', 'pointer-events-none');
      
      // Animate Out after 3 seconds
      setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0', 'pointer-events-none');
      }, 3000);
    }

    // 3. Initialize UI on Load
    window.addEventListener('DOMContentLoaded', () => {
      const isDarkNow = document.documentElement.classList.contains('dark');
      updateButtonIcon(isDarkNow);
    });
  </script>

</body>
</html>
