<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ApproveIt | Login</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-indigo-600 to-purple-700 flex items-center justify-center p-4">

  <div class="bg-white w-full max-w-[420px] rounded-3xl shadow-2xl p-10">

    <h1 class="text-3xl font-bold text-center mb-6">ApproveIt</h1>

    <!-- Role -->
    <select id="role" class="w-full p-3 mb-4 border rounded">
      <option value="student">Student</option>
      <option value="faculty">Faculty</option>
      <option value="admin">Admin</option>
    </select>

    <!-- LOGIN -->
    <div id="loginForm">
      <input id="loginEmail" type="email" placeholder="Email" class="w-full p-3 mb-3 border rounded" />
      <input id="loginPassword" type="password" placeholder="Password" class="w-full p-3 mb-3 border rounded" />

      <button onclick="login()" class="w-full bg-indigo-600 text-white p-3 rounded">
        Login
      </button>

      <p class="mt-4 text-center">
        <button onclick="showSignup()">Create Account</button>
      </p>
    </div>

    <!-- SIGNUP -->
   <div id="signupForm" class="hidden">

  <input id="signupName" type="text" placeholder="Name" class="w-full p-3 mb-3 border rounded" />

  <input id="signupEmail" type="email" placeholder="Email" class="w-full p-3 mb-3 border rounded" />

  <!-- STUDENT ONLY -->
  <div id="studentFields">
    <input id="signupRollNo" type="text" placeholder="Roll No" class="w-full p-3 mb-3 border rounded" />
    <input id="signupDepartment" type="text" placeholder="Department" class="w-full p-3 mb-3 border rounded" />
  </div>

  <input id="signupPassword" type="password" placeholder="Password" class="w-full p-3 mb-3 border rounded" />

  <button onclick="signup()" class="w-full bg-green-600 text-white p-3 rounded">
    Create Account
  </button>

    </div>

  </div>

<script>

// SWITCH FORMS
function showSignup() {
  document.getElementById("loginForm").classList.add("hidden");
  document.getElementById("signupForm").classList.remove("hidden");
}

function showLogin() {
  document.getElementById("signupForm").classList.add("hidden");
  document.getElementById("loginForm").classList.remove("hidden");
}
document.getElementById("role").addEventListener("change", function () {
  const role = this.value;
  const studentFields = document.getElementById("studentFields");

  if (role === "student") {
    studentFields.style.display = "block";
  } else {
    studentFields.style.display = "none";
  }
});

/* OPTIONAL but recommended */
window.onload = () => {
  const role = document.getElementById("role").value;
  const studentFields = document.getElementById("studentFields");
  studentFields.style.display = role === "student" ? "block" : "none";
};


// SIGNUP FUNCTION (FIXED 🔥)
async function signup() {
  const name = document.getElementById("signupName").value;
  const email = document.getElementById("signupEmail").value;
  const rollNo = document.getElementById("signupRollNo").value;
  const department = document.getElementById("signupDepartment").value;
  const password = document.getElementById("signupPassword").value;
  const role = document.getElementById("role").value;

  // ---------------- VALIDATIONS ----------------
  const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  if (!name || !email || !password) {
    alert("Name, Email & Password are required");
    return;
  }

  if (!emailRegex.test(email)) {
    alert("Invalid email format");
    return;
  }

  if (password.length < 6) {
    alert("Password must be at least 6 characters");
    return;
  }

  // ---------------- ROUTE SELECTION ----------------
  let url = "";

  if (role === "student") {
    url = "http://localhost:5000/api/students/signup";
  } else if (role === "faculty") {
    url = "http://localhost:5000/api/faculty/signup";
  } else {
    url = "http://localhost:5000/api/admin/signup";
  }

  // ---------------- PAYLOAD FIX (IMPORTANT PART) ----------------
  let payload = {
    name,
    email,
    password,
    
  };

  // only student gets extra fields
  if (role === "student") {
    payload.rollNo = rollNo;
    payload.department = department;
  }

  // ---------------- API CALL ----------------
  try {
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    const data = await res.json();

    if (!res.ok) {
      alert(data.message || "Signup failed");
      return;
    }

    alert("Signup successful 🎉");

    // auto fill login
    document.getElementById("loginEmail").value = email;
    document.getElementById("loginPassword").value = password;

    showLogin();

  } catch (err) {
    console.error(err);
    alert("Server error");
  }
}

// LOGIN FUNCTION (WORKING)
async function login() {
  const email = document.getElementById("loginEmail").value;
  const password = document.getElementById("loginPassword").value;
  const role = document.getElementById("role").value;
  const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

if (!emailRegex.test(email)) {
  alert("Invalid email format");
  return;
}

if (password.length < 6) {
  alert("Password must be at least 6 characters");
  return;
}

  if (!email || !password) {
    alert("Email & password required");
    return;
  }

  let url = "";

  if (role === "student") {
    url = "http://localhost:5000/api/students/login";
  } else if (role === "faculty") {
    url = "http://localhost:5000/api/faculty/login";
  } else {
    url = "http://localhost:5000/api/admin/login";
  }

  try {
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password })
    });

    const data = await res.json();

    if (!res.ok) {
      alert(data.message || "Login failed");
      return;
    }

    alert("Login successful");

    if (role === "student") {
      window.location.href = "student.html";
       localStorage.setItem("studentId", data.student.id);

    } else if (role === "faculty") {
      window.location.href = "faculty.html";
       localStorage.setItem("facultyId", data.faculty.id); // 🔥 important
    } else {
      window.location.href = "admin.html";
    }

  } catch (err) {
    alert("Server error");
  }
}

</script>

</body>
</html>
