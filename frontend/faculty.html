<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ApproveIt | Faculty Dashboard</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script>
    // 1. Configure Tailwind
    tailwind.config = {
      darkMode: 'class',
    }

    // 2. Immediate Theme Apply (Prevents white flash)
    if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>
</head>

<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-white min-h-screen transition-colors duration-500">

  <nav class="flex justify-between items-center p-4 bg-white dark:bg-gray-800 shadow-md border-b dark:border-gray-700">
    <div class="flex items-center gap-2">
      <span class="text-2xl">👩‍🏫</span>
      <h1 class="text-xl font-bold tracking-tight">ApproveIt Faculty</h1>
    </div>
    
    <div class="flex gap-6 items-center">
      <div class="relative cursor-pointer">
        <span class="text-xl">🔔</span>
        <span class="absolute -top-1 -right-1 bg-red-500 w-2.5 h-2.5 rounded-full border-2 border-white dark:border-gray-800"></span>
      </div>
      
      <button id="themeBtn" onclick="toggleDark()" class="w-10 h-10 flex items-center justify-center rounded-xl bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 transition-all active:scale-90">
        🌙
      </button>
    </div>
  </nav>

  <main class="p-6 max-w-4xl mx-auto mt-8">

    <div class="mb-8">
      <h2 class="text-3xl font-bold">Faculty Review Portal</h2>
      <p class="text-gray-500 dark:text-gray-400">Review and authorize student internship requests.</p>
    </div>

    <!-- ✅ Dynamic Requests Container -->
<div id="requestContainer" class="space-y-6"></div>

      <div class="mb-8">
        <div class="flex justify-between text-xs font-bold mb-2">
          <span>Overall Progress</span>
          <span>40%</span>
        </div>
        <div class="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-3">
          <div class="bg-yellow-500 h-3 rounded-full w-[40%] shadow-[0_0_10px_rgba(234,179,8,0.4)]"></div>
        </div>
      </div>

      <div class="bg-gray-50 dark:bg-gray-700/50 rounded-2xl p-6 mb-8 border-2 border-dashed border-gray-300 dark:border-gray-600 flex flex-col items-center justify-center group cursor-pointer hover:border-blue-500 transition-colors">
        <span class="text-5xl mb-3 opacity-40 group-hover:scale-110 transition">📄</span>
        <p class="text-sm font-bold text-gray-400 group-hover:text-blue-500">Preview Internship_Application.pdf</p>
      </div>

      
      </div>
    </div>
  </main>

  <div id="toast" class="hidden fixed bottom-10 right-10 flex items-center gap-3 bg-slate-900 dark:bg-white text-white dark:text-slate-900 px-6 py-4 rounded-2xl shadow-2xl transition-all duration-300 translate-y-20 opacity-0">
    <span id="toastIcon">✅</span>
    <span id="toastMsg" class="font-bold"></span>
  </div>

  <script>
  // ✅ 1. LOAD REQUESTS (SEPARATE FUNCTION)
  async function loadRequests() {
  try {
    const res = await fetch("http://localhost:5000/api/faculty/requests");
    const data = await res.json();

    const container = document.getElementById("requestContainer");
    container.innerHTML = "";

    if (data.length === 0) {
      container.innerHTML = `<p class="text-center text-gray-400">No Requests Found</p>`;
      return;
    }

    data.forEach(req => {
      const card = `
      <div class="bg-white dark:bg-gray-800 p-8 rounded-3xl shadow-lg border border-gray-200 dark:border-gray-700">

        <div class="flex justify-between items-start mb-6">
          <div>
            <h3 class="text-2xl font-bold">${req.title}</h3>
            <p class="text-blue-600 dark:text-blue-400 font-semibold mt-1">
              Student ID: ${req.studentId}
            </p>
            <p class="text-xs text-gray-400 uppercase mt-1">
              Request ID: ${req.id}
            </p>
          </div>

          <span class="${
            req.status === "PENDING"
              ? "bg-yellow-100 text-yellow-700"
              : req.status === "APPROVED"
              ? "bg-green-100 text-green-700"
              : "bg-red-100 text-red-700"
          } px-4 py-1.5 rounded-full text-[10px] font-bold uppercase">
            ${req.status}
          </span>
        </div>

        <div class="mb-6">
          <p class="text-gray-500">${req.description}</p>
        </div>

        ${
          req.status === "PENDING"
            ? `
        <div class="flex flex-col sm:flex-row gap-4">
          <button onclick="updateStatus(${req.id}, 'APPROVED')" 
            class="flex-1 bg-green-600 hover:bg-green-700 px-6 py-4 rounded-2xl text-white font-bold">
            ✅ Approve Request
          </button>

          <button onclick="updateStatus(${req.id}, 'REJECTED')" 
            class="flex-1 bg-red-600 hover:bg-red-700 px-6 py-4 rounded-2xl text-white font-bold">
            ❌ Reject
          </button>
        </div>
        `
            : `
<p class="text-sm font-semibold mt-3 ${
  req.status === "APPROVED" ? "text-green-500" : "text-red-500"
}">
  ✔ Already ${req.status}
</p>
`
        }

      </div>
      `;

      container.innerHTML += card;
    });

  } catch (err) {
    console.error("Load Error:", err);
  }
}
  // ✅ 2. UPDATE STATUS
  async function updateStatus(requestId, status) {
    const token = localStorage.getItem("token");

    try {
      const response = await fetch(`http://localhost:5000/api/faculty/update-status/${requestId}`, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${token}`
        },
        body: JSON.stringify({ status })
      });

      const data = await response.json();
      console.log("Response:", data);

      showToast("Status Updated Successfully!", "success");

      loadRequests(); // 🔥 IMPORTANT (refresh UI)

    } catch (err) {
      console.error("Frontend Error:", err);
      showToast("Error updating status", "error");
    }
  }

  // ✅ 3. DARK MODE
  function toggleDark() {
    const isDark = document.documentElement.classList.toggle('dark');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
    updateUI(isDark);
  }

  function updateUI(isDark) {
    const btn = document.getElementById('themeBtn');
    if(btn) btn.innerText = isDark ? '☀️' : '🌙';
  }

  // ✅ 4. TOAST
  function showToast(message, type) {
    const toast = document.getElementById('toast');
    const toastMsg = document.getElementById('toastMsg');
    const toastIcon = document.getElementById('toastIcon');

    toastMsg.innerText = message;
    toastIcon.innerText = (type === 'success') ? '✅' : '❌';
    
    toast.classList.remove('hidden', 'translate-y-20', 'opacity-0');
    
    setTimeout(() => {
      toast.classList.add('translate-y-20', 'opacity-0');
      setTimeout(() => toast.classList.add('hidden'), 3000);
    }, 3000);
  }

  // ✅ 5. PAGE LOAD
  window.addEventListener('DOMContentLoaded', () => {
    const isDarkNow = document.documentElement.classList.contains('dark');
    updateUI(isDarkNow);

    loadRequests(); // 🔥 main trigger
  });
</script>

</body>
</html>
