<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <title>Faculty Dashboard</title>
  <link rel="stylesheet" href="./src/output.css">
  <script src="./src/app.js" defer></script>
</head>

<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-white min-h-screen">

<!-- Navbar -->
<nav class="flex justify-between items-center p-4 bg-white dark:bg-gray-800 shadow">
  <h1 class="text-xl font-bold">ApproveIt – Faculty</h1>
  <div class="flex gap-4 items-center">
    🔔
    <button onclick="toggleDark()">🌙</button>
  </div>
</nav>

<!-- Main -->
<div class="p-6 max-w-4xl mx-auto">

  <!-- Pending Request Card -->
  <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow mb-6">
    <h2 class="text-lg font-semibold mb-2">Student Approval Request</h2>
    <p class="text-sm mb-4">Student: Sana G. Chowdhury</p>

    <!-- Progress -->
    <div class="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-3 mb-4">
      <div class="bg-yellow-500 h-3 rounded-full w-[40%]"></div>
    </div>

    <!-- PDF Preview -->
    <img src="./assets/pdf-placeholder.png" class="w-full h-40 object-cover rounded mb-4">

    <!-- Actions -->
    <div class="flex gap-4">
      <button onclick="showToast('Request Approved')" class="bg-green-600 px-4 py-2 rounded text-white">
        Approve
      </button>
      <button onclick="showToast('Request Rejected')" class="bg-red-600 px-4 py-2 rounded text-white">
        Reject
      </button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="hidden fixed bottom-6 right-6 bg-black text-white px-4 py-2 rounded shadow"></div>

</body>
</html>
